name: tracelet_example
description: "Unified example demonstrating Tracelet on Android & iOS."
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  tracelet:
    path: ../packages/tracelet
  # Exposes the flutter_rust_bridge engine handles used for on-device
  # simulation of driving/crash/transport-mode logic in the example + tests.
  tracelet_platform_interface:
    path: ../packages/tracelet_platform_interface
  tracelet_sync:
    path: ../packages/tracelet_sync
  tracelet_android:
    path: ../packages/tracelet_android
  tracelet_ios:
    path: ../packages/tracelet_ios
  tracelet_doctor:
    path: ../packages/tracelet_doctor
  cupertino_icons: ^1.0.8
  # Terminated-state geofence testing (#355): a crossing that fires while
  # the app is killed has no UI to land in, so the notification IS the
  # observation. Posted from the headless isolate.
  flutter_local_notifications: ^19.0.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  mobile_scanner: ^7.2.0
  # Pure-Dart QR encoder. Already present transitively via qr_flutter, but
  # test_server.dart is a plain `dart` script rather than a Flutter app, so it
  # needs the direct dependency to import it.
  qr: ^3.0.2
  qr_flutter: ^4.1.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
