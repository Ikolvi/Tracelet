name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  # sccache cannot cache incremental compilation, which cargo enables by
  # default for debug builds (uniffi-bindgen `cargo run`s, host test builds).
  # Disabling it lets sccache cache those instead of recompiling every run.
  CARGO_INCREMENTAL: "0"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  analyze:
    name: Analyze & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache Pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ~/.local/share/pub-cache
            ~/AppData/Local/Pub/Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install Melos
        run: dart pub global activate melos
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install cargo-binstall
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      - name: Install flutter_rust_bridge_codegen
        run: cargo binstall -y --force flutter_rust_bridge_codegen@2.12.0
      - name: Bootstrap
        run: melos bootstrap
      - name: Generate Rust Bindings
        working-directory: packages/tracelet_platform_interface
        run: flutter_rust_bridge_codegen generate
      - name: Check for uncommitted generated files
        # Scoped to the only codegen output that is tracked: the Dart bindings
        # and the C header are both gitignored. A repo-wide `git status` also
        # trips on files no codegen step writes — Flutter's own `pub get`
        # rewrites every analysis_options.yaml since 3.47 (#381).
        run: |
          if [ -n "$(git status --porcelain -- sdk/rust-core/core/src/frb_generated.rs)" ]; then
            echo "❌ Generated files are out of date!"
            echo "Please run 'flutter_rust_bridge_codegen generate' locally and commit the changes."
            git diff -- sdk/rust-core/core/src/frb_generated.rs
            exit 1
          fi
          echo "✅ Generated files are up to date."
      - name: Check formatting
        run: melos run format
      - name: Generate mock env for examples
        run: |
          echo "const supabaseUrl = 'https://dummy.supabase.co';" > example_supabase/lib/env.dart
          echo "const supabaseAnonKey = 'dummy';" >> example_supabase/lib/env.dart
      - name: Analyze
        run: melos run analyze

  test-rust:
    name: Tests (rust-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Run Rust tests
        working-directory: sdk/rust-core
        run: cargo test

  test:
    name: Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        package:
          - tracelet
          - tracelet_platform_interface
          - tracelet_android
          - tracelet_ios
          - tracelet_web
          - tracelet_doctor
          - tracelet_sync
          - tracelet_firebase
          - tracelet_supabase
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache Pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ~/.local/share/pub-cache
            ~/AppData/Local/Pub/Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install Melos
        run: dart pub global activate melos
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install cargo-binstall
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      - name: Install flutter_rust_bridge_codegen
        run: cargo binstall -y --force flutter_rust_bridge_codegen@2.12.0
      - name: Bootstrap
        run: melos bootstrap
      - name: Generate Rust Bindings
        working-directory: packages/tracelet_platform_interface
        run: flutter_rust_bridge_codegen generate
      - name: Build Host Rust Library
        working-directory: sdk/rust-core
        run: cargo build --release
      - name: Setup LD_LIBRARY_PATH for tests
        run: echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/sdk/rust-core/target/release:$LD_LIBRARY_PATH" >> $GITHUB_ENV
      - name: Run tests
        working-directory: packages/${{ matrix.package }}
        run: |
          if [ -d "test" ]; then
            flutter test --coverage
          else
            echo "No test directory found. Skipping tests."
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache Pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ~/.local/share/pub-cache
            ~/AppData/Local/Pub/Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install Melos
        run: dart pub global activate melos
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install cargo-binstall
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      - name: Install flutter_rust_bridge_codegen & cargo-ndk
        run: |
          cargo binstall -y --force flutter_rust_bridge_codegen@2.12.0
          cargo binstall -y --force cargo-ndk
      - name: Bootstrap
        run: melos bootstrap
      - name: Generate Rust Bindings
        working-directory: packages/tracelet_platform_interface
        run: flutter_rust_bridge_codegen generate

      - name: Build Android Rust Core
        run: ./sdk/rust-core/build-android.sh

      - name: Build example APK
        working-directory: example
        run: flutter build apk --release

      - name: Verify FRB Symbols in Release APK
        working-directory: example
        run: |
          unzip -q build/app/outputs/flutter-apk/app-release.apk -d extracted_apk
          SO="extracted_apk/lib/arm64-v8a/libtracelet_core.so"
          if ! nm -D "$SO" | grep -q "frbgen_tracelet"; then
            echo "❌ ERROR: flutter_rust_bridge symbols were stripped from the Android Release APK (libtracelet_core)!"
            exit 1
          fi
          COUNT=$(nm -D "$SO" | grep -c "frbgen_tracelet")
          echo "✅ Verified $COUNT frbgen_tracelet symbols present in the APK (libtracelet_core)"

          SO_SYNC="extracted_apk/lib/arm64-v8a/libtracelet_sync.so"
          if ! nm -D "$SO_SYNC" | grep -q "uniffi_"; then
            echo "❌ ERROR: uniffi symbols were stripped from the Android Release APK (libtracelet_sync)!"
            exit 1
          fi
          COUNT_SYNC=$(nm -D "$SO_SYNC" | grep -c "uniffi_")
          echo "✅ Verified $COUNT_SYNC uniffi symbols present in the APK (libtracelet_sync)"

      # Gate the tracelet_android plugin's Kotlin unit tests (boot, config,
      # location-service, DB, headless-sync wiring). These exercise the host
      # Rust core via JNA / System.loadLibrary, so build the host lib first and
      # expose it via jna.library.path/java.library.path (wired in the module's
      # build.gradle). Without this step these tests never run in CI.
      - name: Build Host Rust Library (for plugin unit tests)
        working-directory: sdk/rust-core
        run: cargo build

      - name: Run tracelet_android unit tests
        working-directory: example/android
        run: ./gradlew :tracelet_android:testDebugUnitTest

      # Gate the native tracelet-sdk / tracelet-sync-sdk Kotlin unit tests too.
      # These previously ran only in release.yml, so a regression could sit on
      # main until release day — the #274/#276 geofence exit-accuracy coverage is
      # exactly the kind of test that must gate every PR. Reuses the host Rust
      # library built above and exposed via jna.library.path.
      - name: Run tracelet-sdk unit tests
        working-directory: sdk/android
        run: ./gradlew :tracelet-sdk:testDebugUnitTest :tracelet-sync-sdk:testDebugUnitTest

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache Pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ~/.local/share/pub-cache
            ~/AppData/Local/Pub/Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install Melos
        run: dart pub global activate melos
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install cargo-binstall
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      - name: Install flutter_rust_bridge_codegen
        run: cargo binstall -y --force flutter_rust_bridge_codegen@2.12.0
      - name: Bootstrap
        run: melos bootstrap
      - name: Generate Rust Bindings
        working-directory: packages/tracelet_platform_interface
        run: flutter_rust_bridge_codegen generate

      - name: Build iOS Rust Core
        run: ./sdk/rust-core/build-ios.sh

      - name: Build example iOS
        working-directory: example
        run: flutter build ios --no-codesign --release

      # The example builds the monorepo podspecs; pub.dev consumers get the
      # rewritten ones, and nothing here exercised that shape — which is how a
      # podspec no consumer could load reached main. (#390)
      - name: Verify published CocoaPods fallback
        run: |
          # A published podspec fetches the GitHub Release for its own version,
          # which does not exist until the release job runs. Validate the
          # mechanism against the most recently published version instead
          # (tracelet_ios and tracelet_sync are bumped in lockstep).
          git fetch --tags --quiet
          LATEST=$(git tag --list 'tracelet_ios-v*' | sed 's/^tracelet_ios-v//' | sort -V | tail -1)
          echo "Verifying against tracelet_ios-v${LATEST}"
          scripts/verify_cocoapods_fallback.sh --version "$LATEST"

      - name: Verify FRB Symbols are not stripped
        working-directory: example
        run: |
          echo "Extracting expected FRB symbols from static library..."
          EXPECTED_SYMBOLS=$(nm -g ../sdk/rust-core/target/aarch64-apple-ios/release/libtracelet_core.a 2>/dev/null | grep -E " T _frb| T _store_dart" | awk '{print $3}' | sed 's/^_//' | sort | uniq)
          
          echo "Dumping symbols from all binaries in Runner.app (executable + embedded frameworks)..."
          # The FRB/uniffi symbols now live in the embedded TraceletCore.framework /
          # TraceletSyncFFI.framework dynamic binaries (loaded at runtime via
          # ExternalLibrary.open), not in the Runner executable. Scan every Mach-O in
          # the bundle so the check matches the dynamic-framework delivery (this is
          # what release.yml already does).
          find build/ios/iphoneos/Runner.app -type f -perm +111 -exec nm -g {} 2>/dev/null \; > runner_symbols.txt
          
          echo "Verifying symbols in Release build..."
          MISSING_SYMBOLS=0
          for symbol in $EXPECTED_SYMBOLS; do
            if ! grep -q "$symbol" runner_symbols.txt; then
              echo "❌ ERROR: Symbol $symbol was stripped from the iOS Release build!"
              MISSING_SYMBOLS=$((MISSING_SYMBOLS + 1))
            fi
          done
          
          if [ "$MISSING_SYMBOLS" -gt 0 ]; then
            echo "❌ $MISSING_SYMBOLS symbols were stripped from tracelet_core!"
            exit 1
          else
            echo "✅ All tracelet_core flutter_rust_bridge symbols successfully preserved!"
          fi

          echo "Extracting expected FRB symbols from tracelet_sync static library..."
          EXPECTED_SYNC_SYMBOLS=$(nm -g ../sdk/rust-core/target/aarch64-apple-ios/release/libtracelet_sync.a 2>/dev/null | grep -E " T _frb| T _store_dart" | awk '{print $3}' | sed 's/^_//' | sort | uniq)
          
          echo "Verifying tracelet_sync symbols in Release build..."
          MISSING_SYNC_SYMBOLS=0
          for symbol in $EXPECTED_SYNC_SYMBOLS; do
            if ! grep -q "$symbol" runner_symbols.txt; then
              echo "❌ ERROR: Symbol $symbol was stripped from the iOS Release build (tracelet_sync)!"
              MISSING_SYNC_SYMBOLS=$((MISSING_SYNC_SYMBOLS + 1))
            fi
          done
          
          if [ "$MISSING_SYNC_SYMBOLS" -gt 0 ]; then
            echo "❌ $MISSING_SYNC_SYMBOLS symbols were stripped from tracelet_sync!"
            exit 1
          else
            echo "✅ All tracelet_sync flutter_rust_bridge symbols successfully preserved!"
          fi

      # Gate the native TraceletSDK XCTest suites. release.yml runs `swift test
      # || true` from the repo root, where there is no Package.swift — so the
      # iOS SDK tests have never actually run or gated anything. The SPM
      # manifest targets iOS (UIKit), so this needs a simulator destination
      # rather than a plain `swift test`.
      - name: Run TraceletSDK unit tests (iOS Simulator)
        working-directory: sdk/ios
        run: |
          set -euo pipefail
          # Package.swift consumes the Rust core as a binaryTarget built by
          # build-ios.sh (run earlier in this job). *.xcframework is gitignored,
          # so assert it is present rather than letting SwiftPM fail with the
          # opaque "does not contain a binary artifact".
          XCF="../rust-core/out/TraceletCore.xcframework"
          if [ ! -d "$XCF" ]; then
            echo "❌ $XCF is missing — 'Build iOS Rust Core' must run before this step."
            exit 1
          fi
          # Resolve a concrete simulator UDID rather than hardcoding a device
          # name or OS version, both of which drift with the runner image.
          # `generic/platform=iOS Simulator` is not usable for `test`.
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for r in d for x in d[r] if 'iPhone' in x['name']))")
          echo "Using simulator $UDID"
          xcodebuild test -scheme TraceletSDK -destination "id=$UDID"

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache Pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            ~/.local/share/pub-cache
            ~/AppData/Local/Pub/Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      - name: Install Melos
        run: dart pub global activate melos
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install cargo-binstall
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      - name: Install flutter_rust_bridge_codegen
        run: cargo binstall -y --force flutter_rust_bridge_codegen@2.12.0
      - name: Bootstrap
        run: melos bootstrap
      - name: Generate Rust Bindings
        working-directory: packages/tracelet_platform_interface
        run: flutter_rust_bridge_codegen generate
      - name: Build example Web
        working-directory: example
        run: flutter build web

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: false
          path: coverage-artifacts

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Merge coverage
        run: |
          mkdir -p coverage
          LCOV_FILES=""
          for pkg in tracelet tracelet_platform_interface tracelet_android tracelet_ios tracelet_web tracelet_doctor tracelet_sync tracelet_firebase tracelet_supabase; do
            FILE="coverage-artifacts/coverage-${pkg}/lcov.info"
            if [ -s "$FILE" ]; then
              LCOV_FILES="$LCOV_FILES -a $FILE"
            elif [ -f "$FILE" ]; then
              # A package whose suite exercises no Dart library code (e.g.
              # tracelet_sync, whose tests assert on native source invariants)
              # emits a zero-byte lcov.info. lcov >=2 treats an empty trace file
              # as a hard error, so leave it out of the merge.
              echo "Skipping empty coverage file for ${pkg}"
            fi
          done
          if [ -n "$LCOV_FILES" ]; then
            lcov $LCOV_FILES -o coverage/merged.lcov.info
            lcov --summary coverage/merged.lcov.info
          else
            echo "No coverage files found"
            exit 0
          fi

      - name: Upload merged coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-merged
          path: coverage/merged.lcov.info
          if-no-files-found: ignore

  validate:
    name: Validate Monorepo
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v7

      - name: Check version consistency
        run: |
          echo "Checking version consistency across packages..."
          VERSIONS=""
          for pkg in tracelet tracelet_platform_interface tracelet_android tracelet_ios tracelet_web tracelet_doctor tracelet_sync tracelet_firebase tracelet_supabase; do
            VER=$(grep '^version:' "packages/$pkg/pubspec.yaml" | awk '{print $2}')
            echo "  $pkg: $VER"
            VERSIONS="$VERSIONS $VER"
          done
          # All versions should be identical
          UNIQUE=$(echo $VERSIONS | tr ' ' '\n' | sort -u | wc -l | tr -d ' ')
          if [ "$UNIQUE" -ne 1 ]; then
            echo "❌ Version mismatch detected!"
            exit 1
          fi
          echo "✅ All packages at version$(echo $VERSIONS | awk '{print $1}')"

      - name: Check CHANGELOG entries
        run: |
          echo "Checking CHANGELOG.md files exist and have entries..."
          for pkg in tracelet tracelet_platform_interface tracelet_android tracelet_ios tracelet_web tracelet_doctor tracelet_sync tracelet_firebase tracelet_supabase; do
            FILE="packages/$pkg/CHANGELOG.md"
            if [ ! -f "$FILE" ]; then
              echo "❌ Missing $FILE"
              exit 1
            fi
            LINES=$(wc -l < "$FILE" | tr -d ' ')
            if [ "$LINES" -lt 3 ]; then
              echo "❌ $FILE appears empty ($LINES lines)"
              exit 1
            fi
            echo "  ✅ $FILE ($LINES lines)"
          done

      - name: Check dependency constraints
        run: |
          echo "Checking cross-package dependency constraints..."
          IFACE_VER=$(grep '^version:' packages/tracelet_platform_interface/pubspec.yaml | awk '{print $2}')
          for pkg in tracelet tracelet_android tracelet_ios tracelet_web tracelet_sync; do
            CONSTRAINT=$(grep 'tracelet_platform_interface:' "packages/$pkg/pubspec.yaml" | head -1 | awk '{print $2}')
            echo "  $pkg depends on tracelet_platform_interface: $CONSTRAINT (interface is $IFACE_VER)"
          done
          
          # Verify tracelet_doctor, firebase, supabase dependency on tracelet
          CORE_VER=$(grep '^version:' packages/tracelet/pubspec.yaml | awk '{print $2}')
          for pkg in tracelet_doctor tracelet_firebase tracelet_supabase; do
            CONSTRAINT=$(grep 'tracelet:' "packages/$pkg/pubspec.yaml" | head -1 | awk '{print $2}')
            echo "  $pkg depends on tracelet: $CONSTRAINT (core is $CORE_VER)"
          done
          
          echo "✅ Dependency constraints checked"

