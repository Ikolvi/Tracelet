name: tracelet_workspace
publish_to: none

environment:
  sdk: ^3.10.3

workspace:
  - packages/tracelet
  - packages/tracelet_platform_interface
  - packages/tracelet_android
  - packages/tracelet_ios
  - packages/tracelet_web
  - packages/tracelet_sync
  - packages/tracelet_doctor
  - packages/tracelet_supabase
  - packages/tracelet_firebase
  - example_supabase
  - example_firebase
  - example

dev_dependencies:
  # Kept in step with the version CI activates globally. The global melos shim
  # delegates to this workspace copy once it is resolved, but `melos bootstrap`
  # is what resolves it — so on a cold cache bootstrap runs as the global
  # version and on a warm one as this pin. When the two differed (8.x vs 7.x)
  # they disagreed about the analyzer excludes written into each package's
  # analysis_options.yaml, and CI's generated-files check went red or green
  # depending on nothing but cache state.
  melos: ^8.0.0
  very_good_analysis: ^6.0.0

melos:
  repository: https://github.com/Ikolvi/Tracelet
  
  ide:
    intellij: false

  command:
    version:
      linkTo:
        - "tracelet*"
      # The native SDKs (Android gradle.properties, the iOS podspecs, and the
      # plugins' native-dependency pins) are not Dart packages, so Melos cannot
      # version them. This hook runs after Melos updates the Flutter pubspecs and
      # before the version commit, syncing every native version location from
      # `packages/tracelet/pubspec.yaml` so they never drift out of lockstep.
      hooks:
        preCommit: python3 scripts/sync_native_versions.py && git add -A

  scripts:
    analyze:
      description: Run dart analyze across all packages
      exec:
        command: dart analyze --fatal-infos .
        concurrency: 4

    format:
      description: Check formatting across all packages
      exec:
        command: find . -maxdepth 1 -type d \( -name lib -o -name test -o -name example -o -name integration_test -o -name bin \) -print0 | xargs -0 dart format --set-exit-if-changed
        concurrency: 4

    format:fix:
      description: Fix formatting across all packages
      exec:
        command: find . -maxdepth 1 -type d \( -name lib -o -name test -o -name example -o -name integration_test -o -name bin \) -print0 | xargs -0 dart format
        concurrency: 4

    test:
      description: Run tests across all packages
      packageFilters:
        dirExists: test
      exec:
        command: flutter test --coverage
        concurrency: 1
        failFast: true

    test:dart:
      description: Run Dart-only tests (no Flutter)
      packageFilters:
        dirExists: test
        noDependsOn: flutter
      exec:
        command: dart test
        concurrency: 1

    pigeon:
      description: Generate Pigeon API bindings
      run: dart run pigeon --input pigeons/tracelet_api.dart
      packageFilters:
        scope: tracelet_platform_interface

    clean:
      description: Clean all packages
      exec:
        command: flutter clean
        concurrency: 4

    pub:get:
      description: Run pub get across all packages
      exec:
        command: flutter pub get
        concurrency: 4

    build:example:android:
      description: Build example app for Android
      run: flutter build apk --debug
      packageFilters:
        scope: tracelet_example
        dirExists: lib

    build:example:ios:
      description: Build example app for iOS
      run: flutter build ios --no-codesign --debug
      packageFilters:
        scope: tracelet_example
        dirExists: lib

    build:example:web:
      description: Build example app for Web
      run: flutter build web
      packageFilters:
        scope: tracelet_example
        dirExists: lib

    coverage:
      description: Generate coverage report
      packageFilters:
        dirExists: test
      exec:
        command: |
          flutter test --coverage
          genhtml coverage/lcov.info -o coverage/html
        concurrency: 1

    benchmark:
      description: Run performance benchmarks
      run: cd benchmark && flutter pub get && flutter test test/tracelet_benchmark_test.dart --reporter expanded

    pana:
      description: Run pana (pub.dev scoring) on all publishable packages
      run: dart pub global run pana --no-warning --exit-code-threshold 0
      packageFilters:
        noPrivate: true
