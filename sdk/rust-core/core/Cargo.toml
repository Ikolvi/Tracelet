[package]
name = "tracelet_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "tracelet_core"

[dependencies]
uniffi = { version = "0.31.1", features = ["cli"] }
geo = "0.28.0"
rstar = "0.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.133"
chrono = "0.4.44"
flutter_rust_bridge = "=2.13.0"
thiserror = "2.0.11"
log = "0.4.21"
rusqlite = { version = "0.31.0", features = ["bundled"] }
sha2 = "0.10.8"
hex = "0.4.3"
aes-gcm = "0.10.3"
rand = "0.8.5"
[dev-dependencies]
criterion = "0.8.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
